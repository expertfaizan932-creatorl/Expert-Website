name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_PORT: ${{ vars.APP_PORT || '3000' }}
  SSH_USER: ${{ vars.SSH_USER || 'root' }}
  SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/expert-website' }}

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Environment info
        run: |
          node -v
          npm -v
          git --version
          df -h /

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/npm-ci.log" || {
            echo "npm ci failed — last lines:"
            tail -n 25 "$RUNNER_TEMP/npm-ci.log"
            tail -n 6 "$RUNNER_TEMP/npm-ci.log" | sed 's|^|::error::ci: |'
            { echo "### npm ci failed"; echo '```'; tail -n 25 "$RUNNER_TEMP/npm-ci.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            echo "build failed — last lines:"
            tail -n 30 "$RUNNER_TEMP/build.log"
            tail -n 8 "$RUNNER_TEMP/build.log" | sed 's|^|::error::build: |'
            { echo "### next build failed"; echo '```'; tail -n 30 "$RUNNER_TEMP/build.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Probe available credentials
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY || vars.SERVER_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || vars.SECRET_KEY }}
          ACCESS_KEY: ${{ secrets.ACCESS_KEY || vars.ACCESS_KEY }}
          SSH_KEY: ${{ secrets.SSH_KEY || vars.SSH_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY || vars.PRIVATE_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || vars.SSH_PRIVATE_KEY }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY || vars.DEPLOY_KEY }}
          HOST: ${{ secrets.HOST || vars.HOST }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          SERVER_IP: ${{ secrets.SERVER_IP || vars.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD || vars.SERVER_PASSWORD }}
          PASSWORD: ${{ secrets.PASSWORD || vars.PASSWORD }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE || vars.SSH_PASSPHRASE }}
          USERNAME: ${{ secrets.USERNAME || vars.USERNAME }}
          TOKEN: ${{ secrets.TOKEN || vars.TOKEN }}
        run: |
          set -uo pipefail
          REPORT=""
          for n in SERVER_KEY SECRET_KEY ACCESS_KEY SSH_KEY PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_KEY HOST SERVER_HOST SERVER_IP SERVER_USER SERVER_PASSWORD PASSWORD SSH_PASSPHRASE USERNAME TOKEN; do
            eval "v=\${$n:-}"
            if [ -z "$v" ]; then
              REPORT="$REPORT | $n=MISSING"
              continue
            fi
            fmt="other-text"
            if printf '%s' "$v" | grep -q "BEGIN .*PRIVATE KEY"; then fmt="openssh-private-key"
            elif printf '%s' "$v" | grep -q "BEGIN .*PUBLIC KEY"; then fmt="public-key"
            elif printf '%s' "$v" | grep -q "PuTTY-User-Key-File"; then fmt="putty-ppk"
            elif printf '%s' "$v" | grep -Eq '^([A-Za-z0-9._-]+@)?[A-Za-z0-9.-]+$'; then fmt="host-or-token"
            fi
            REPORT="$REPORT | $n=len:${#v},$fmt"
            echo "$n: length=${#v} format=$fmt"
          done
          echo "Credential inventory (no values printed):$REPORT"
          echo "::notice::Inventory:$REPORT"

      - name: Resolve server credentials
        id: cred
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY || vars.SERVER_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || vars.SECRET_KEY }}
          ACCESS_KEY: ${{ secrets.ACCESS_KEY || vars.ACCESS_KEY }}
          SSH_KEY: ${{ secrets.SSH_KEY || vars.SSH_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY || vars.PRIVATE_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || vars.SSH_PRIVATE_KEY }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY || vars.DEPLOY_KEY }}
          HOST_CAND: ${{ secrets.HOST || vars.HOST }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          SERVER_IP: ${{ secrets.SERVER_IP || vars.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD || vars.SERVER_PASSWORD }}
          PASSWORD: ${{ secrets.PASSWORD || vars.PASSWORD }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE || vars.SSH_PASSPHRASE }}
          USERNAME: ${{ secrets.USERNAME || vars.USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # --- key: pehla value jo PEM private key ho
          KEY=""
          for v in "${SSH_PRIVATE_KEY:-}" "${PRIVATE_KEY:-}" "${SSH_KEY:-}" "${DEPLOY_KEY:-}" "${SERVER_KEY:-}" "${SECRET_KEY:-}" "${ACCESS_KEY:-}"; do
            if [ -n "$v" ] && printf '%s' "$v" | grep -q "BEGIN .*PRIVATE KEY"; then
              KEY="$v"; break
            fi
          done
          if [ -z "$KEY" ]; then
            echo "::error::SSH private key nahi mili. Repo > Settings > Secrets ki list me key naam par 'openssh-private-key' format ki value chahiye."
            exit 1
          fi
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # --- host: pehli value jo server address ho (user@host ya host)
          HOST=""
          for v in "${SERVER_HOST:-}" "${HOST_CAND:-}" "${SERVER_IP:-}" "${ACCESS_KEY:-}" "${SERVER_KEY:-}" "${SECRET_KEY:-}"; do
            [ -z "$v" ] && continue
            if printf '%s' "$v" | grep -Eq '^([A-Za-z0-9._-]+@)?[A-Za-z0-9.-]+$' \
              && printf '%s' "$v" | grep -Eq '[@.]' \
              && [ "${#v}" -lt 120 ] \
              && [ "$v" != "$KEY" ]; then
              HOST="$v"; break
            fi
          done
          if [ -z "$HOST" ]; then
            echo "::error::Server ka host/IP nahi mila. SERVER_HOST (ya HOST) secret me root@1.2.3.4 rakhein."
            exit 1
          fi

          case "$HOST" in
            *@*) USER="${HOST%%@*}"; HOST_ONLY="${HOST#*@}" ;;
            *)   USER="${SERVER_USER:-${SSH_USER:-root}}"; HOST_ONLY="$HOST" ;;
          esac

          # --- key passphrase: pehle khali, phir baaki values
          if ssh-keygen -y -f ~/.ssh/id_deploy -P "" >/dev/null 2>&1; then
            PASSPHRASE_OK="none"
          else
            PASSPHRASE_OK=""
            for v in "${SSH_PASSPHRASE:-}" "${SECRET_KEY:-}" "${SERVER_PASSWORD:-}" "${PASSWORD:-}" "${ACCESS_KEY:-}"; do
              [ -z "$v" ] && continue
              [ "$v" = "$KEY" ] && continue
              [ "$v" = "$HOST" ] && continue
              if ssh-keygen -y -f ~/.ssh/id_deploy -P "$v" >/dev/null 2>&1; then
                PASSPHRASE_OK="$v"; break
              fi
            done
            if [ -z "$PASSPHRASE_OK" ]; then
              echo "::error::SSH key unlock nahi hui. Key passphrase (SSH_PASSPHRASE) ya galat key check karein."
              exit 1
            fi
          fi

          {
            echo "host=$HOST_ONLY"
            echo "user=$USER"
            echo "passphrase=$PASSPHRASE_OK"
          } >> "$GITHUB_OUTPUT"

          ssh-keyscan -p "$SERVER_PORT" -T 15 "$HOST_ONLY" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts
          echo "Resolved deploy target: $USER@$HOST_ONLY:$SERVER_PORT -> $DEPLOY_PATH"

      - name: Upload code (rsync)
        env:
          HOST: ${{ steps.cred.outputs.host }}
          USER: ${{ steps.cred.outputs.user }}
        run: |
          set -euo pipefail
          rsync -az --timeout=60 \
            -e "ssh -p $SERVER_PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'data/' \
            --exclude '.env*' \
            --exclude '*.log' \
            --exclude '.github/' \
            ./ "$USER@$HOST:$DEPLOY_PATH/"

      - name: Install, build & restart on server
        env:
          HOST: ${{ steps.cred.outputs.host }}
          USER: ${{ steps.cred.outputs.user }}
        run: |
          set -euo pipefail
          SSH_CMD="ssh -p $SERVER_PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          $SSH_CMD "$USER@$HOST" "export DEPLOY_PATH='$DEPLOY_PATH' APP_PORT='$APP_PORT'; bash -s" <<'REMOTE'
          set -euo pipefail
          case "$DEPLOY_PATH" in
            "~"*) DEPLOY_PATH="$HOME${DEPLOY_PATH#\~}" ;;
          esac
          cd "$DEPLOY_PATH"

          if ! command -v node >/dev/null 2>&1; then
            echo "::error::Server par Node.js nahi mila. Node 20+ install karein."
            exit 1
          fi
          echo "Node: $(node -v)"

          [ -f package.json ] || { echo "::error::package.json nahi mila in $DEPLOY_PATH"; exit 1; }

          npm ci --no-audit --no-fund
          npm run build
          mkdir -p data

          cat > ecosystem.config.js <<'EOF'
          module.exports = {
            apps: [
              {
                name: "expert-website",
                script: "npm",
                args: "start",
                env: { NODE_ENV: "production", PORT: process.env.APP_PORT || 3000 },
                max_memory_restart: "400M",
              },
            ],
          };
          EOF

          if ! command -v pm2 >/dev/null 2>&1; then
            npm i -g pm2 >/dev/null 2>&1 || sudo npm i -g pm2
          fi
          pm2 startOrReload ecosystem.config.js
          pm2 save >/dev/null 2>&1 || true
          pm2 list
          REMOTE
          echo "Deployed: http://$(printf '%s' "$HOST"):$APP_PORT"
