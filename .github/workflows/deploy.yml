name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_PORT: ${{ vars.APP_PORT || '3000' }}
  SSH_USER: ${{ vars.SSH_USER || 'root' }}
  SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/expert-website' }}

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Environment info
        run: |
          node -v
          npm -v
          git --version
          df -h /

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/npm-ci.log" || {
            echo "npm ci failed — last lines:"
            tail -n 25 "$RUNNER_TEMP/npm-ci.log"
            tail -n 6 "$RUNNER_TEMP/npm-ci.log" | sed 's|^|::error::ci: |'
            { echo "### npm ci failed"; echo '```'; tail -n 25 "$RUNNER_TEMP/npm-ci.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            echo "build failed — last lines:"
            tail -n 30 "$RUNNER_TEMP/build.log"
            tail -n 8 "$RUNNER_TEMP/build.log" | sed 's|^|::error::build: |'
            { echo "### next build failed"; echo '```'; tail -n 30 "$RUNNER_TEMP/build.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Resolve server credentials
        id: cred
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY || secrets.server_key || vars.SERVER_KEY || vars.server_key }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || secrets.secret_key || vars.SECRET_KEY || vars.secret_key }}
          ACCESS_KEY: ${{ secrets.ACCESS_KEY || secrets.access_key || vars.ACCESS_KEY || vars.access_key }}
          SERVER_KEY_SRC: ${{ secrets.SERVER_KEY != '' && 'secret' || vars.SERVER_KEY != '' && 'variable' || 'missing' }}
          SECRET_KEY_SRC: ${{ secrets.SECRET_KEY != '' && 'secret' || vars.SECRET_KEY != '' && 'variable' || 'missing' }}
          ACCESS_KEY_SRC: ${{ secrets.ACCESS_KEY != '' && 'secret' || vars.ACCESS_KEY != '' && 'variable' || 'missing' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # --- non-sensitive diagnostics: source, length, format (koi value print nahi)
          for n in SERVER_KEY SECRET_KEY ACCESS_KEY; do
            eval "v=\${$n:-}"
            eval "src=\${${n}_SRC:-unknown}"
            len=${#v}
            fmt="empty"
            if [ "$len" -gt 0 ]; then
              if printf '%s' "$v" | grep -q "BEGIN .*PRIVATE KEY"; then fmt="openssh-private-key"
              elif printf '%s' "$v" | grep -q "BEGIN .*PUBLIC KEY"; then fmt="public-key"
              elif printf '%s' "$v" | grep -q "PuTTY-User-Key-File"; then fmt="putty-ppk"
              elif printf '%s' "$v" | grep -Eq '^([A-Za-z0-9._-]+@)?[A-Za-z0-9.-]+$'; then fmt="host-or-single-token"
              else fmt="other-text"
              fi
            fi
            echo "::notice::$n: source=$src length=$len format=$fmt"
          done

          # --- find the SSH private key (any secret that looks like a PEM key)
          KEY=""
          for v in "$SERVER_KEY" "$SECRET_KEY" "$ACCESS_KEY"; do
            if printf '%s' "$v" | grep -q "BEGIN .*PRIVATE KEY"; then
              KEY="$v"
              break
            fi
          done
          if [ -z "$KEY" ]; then
            echo "::error::Koi bhi SSH private key nahi mili. Upar diye gaye format me se koi 'openssh-private-key' hona chahiye (-----BEGIN OPENSSH PRIVATE KEY-----). PuTTY .ppk ko ssh-keygen se convert karke lagayein."
            exit 1
          fi
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # --- find the host (something like root@1.2.3.4 or 1.2.3.4 or server.com)
          HOST=""
          for v in "$ACCESS_KEY" "$SERVER_KEY" "$SECRET_KEY"; do
            [ -z "$v" ] && continue
            if printf '%s' "$v" | grep -Eq '^([A-Za-z0-9._-]+@)?[A-Za-z0-9.-]+$' \
              && printf '%s' "$v" | grep -Eq '[@.]' \
              && [ "${#v}" -lt 120 ]; then
              HOST="$v"
              break
            fi
          done
          if [ -z "$HOST" ]; then
            echo "::error::Host nahi mila. ACCESS_KEY me root@SERVER_IP ya SERVER_IP rakhein."
            exit 1
          fi

          # username: host ke andar ho to woh, warna SSH_USER / root
          case "$HOST" in
            *@*) USER="${HOST%%@*}"; HOST_ONLY="${HOST#*@}" ;;
            *)   USER="${SSH_USER}"; HOST_ONLY="$HOST" ;;
          esac

          # --- key passphrase check: pehle khali, phir baaki secrets
          if ssh-keygen -y -f ~/.ssh/id_deploy -P "" >/dev/null 2>&1; then
            PASSPHRASE_OK="none"
          else
            PASSPHRASE_OK=""
            for v in "$SECRET_KEY" "$ACCESS_KEY" "$SERVER_KEY"; do
              [ -z "$v" ] && continue
              if printf '%s' "$v" | grep -q "BEGIN .*PRIVATE KEY"; then continue; fi
              if ssh-keygen -y -f ~/.ssh/id_deploy -P "$v" >/dev/null 2>&1; then
                PASSPHRASE_OK="$v"
                break
              fi
            done
            if [ -z "$PASSPHRASE_OK" ]; then
              echo "::error::SSH key unlock nahi hui (khali passphrase aur secrets tino try kiye)."
              exit 1
            fi
          fi

          {
            echo "host=$HOST_ONLY"
            echo "user=$USER"
            echo "passphrase=$PASSPHRASE_OK"
          } >> "$GITHUB_OUTPUT"

          ssh-keyscan -p "$SERVER_PORT" -T 15 "$HOST_ONLY" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts
          echo "Resolved deploy target: $USER@$HOST_ONLY:$SERVER_PORT -> $DEPLOY_PATH"

      - name: Upload code (rsync)
        env:
          HOST: ${{ steps.cred.outputs.host }}
          USER: ${{ steps.cred.outputs.user }}
        run: |
          set -euo pipefail
          rsync -az --timeout=60 \
            -e "ssh -p $SERVER_PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'data/' \
            --exclude '.env*' \
            --exclude '*.log' \
            --exclude '.github/' \
            ./ "$USER@$HOST:$DEPLOY_PATH/"

      - name: Install, build & restart on server
        env:
          HOST: ${{ steps.cred.outputs.host }}
          USER: ${{ steps.cred.outputs.user }}
        run: |
          set -euo pipefail
          SSH_CMD="ssh -p $SERVER_PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          $SSH_CMD "$USER@$HOST" "export DEPLOY_PATH='$DEPLOY_PATH' APP_PORT='$APP_PORT'; bash -s" <<'REMOTE'
          set -euo pipefail
          case "$DEPLOY_PATH" in
            "~"*) DEPLOY_PATH="$HOME${DEPLOY_PATH#\~}" ;;
          esac
          cd "$DEPLOY_PATH"

          if ! command -v node >/dev/null 2>&1; then
            echo "::error::Server par Node.js nahi mila. Node 20+ install karein."
            exit 1
          fi
          echo "Node: $(node -v)"

          [ -f package.json ] || { echo "::error::package.json nahi mila in $DEPLOY_PATH"; exit 1; }

          npm ci --no-audit --no-fund
          npm run build
          mkdir -p data

          cat > ecosystem.config.js <<'EOF'
          module.exports = {
            apps: [
              {
                name: "expert-website",
                script: "npm",
                args: "start",
                env: { NODE_ENV: "production", PORT: process.env.APP_PORT || 3000 },
                max_memory_restart: "400M",
              },
            ],
          };
          EOF

          if ! command -v pm2 >/dev/null 2>&1; then
            npm i -g pm2 >/dev/null 2>&1 || sudo npm i -g pm2
          fi
          pm2 startOrReload ecosystem.config.js
          pm2 save >/dev/null 2>&1 || true
          pm2 list
          REMOTE
          echo "Deployed: http://$(printf '%s' "$HOST"):$APP_PORT"
